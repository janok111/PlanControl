<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telecom Flow</title>
<style>
:root{--navy:#102a43;--navy2:#183d5b;--blue:#087eaa;--cyan:#27a9c6;--ink:#1d3040;--muted:#738391;--line:#e2e9ee;--bg:#f3f6f8;--white:#fff;--green:#13835b;--greenbg:#e8f5ef;--amber:#a06b0b;--amberbg:#fff4df;--red:#b24c51;--redbg:#fff0ef;--shadow:0 8px 24px #1834490a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #27a9c644;outline-offset:1px}
.sidebar{position:fixed;inset:0 auto 0 0;width:230px;padding:21px 13px;background:var(--navy);color:#fff;display:flex;flex-direction:column;z-index:5;transition:transform .2s}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 25px;font-size:18px;font-weight:800}.brand-mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#1593b8;color:white;font-size:12px}.nav-caption{padding:0 11px 8px;color:#8fa9bd;text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:750}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:none;color:#c8d5df;text-align:left;font-weight:650}.nav button:hover{background:#ffffff12;color:#fff}.nav button.active{background:#ffffff18;color:#fff;box-shadow:inset 3px 0 var(--cyan)}.nav-icon{width:20px;color:#9bb9ca;text-align:center;font-size:15px}.sidebar-foot{margin-top:auto;padding:13px 10px;border-top:1px solid #ffffff20;color:#a2b4c1;font-size:11px}
.main{min-height:100vh;margin-left:230px}.topbar{position:sticky;top:0;z-index:3;min-height:68px;padding:11px 25px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.top-left,.top-right{display:flex;align-items:center;gap:12px}.top-title{color:var(--navy);font-weight:800}.top-right .field{min-width:130px}.top-right input{max-width:155px}.employee-input{width:190px}.language{display:flex;gap:3px;padding:3px;background:#f0f4f6;border-radius:8px}.language button{padding:6px 8px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11px;font-weight:800}.language button.active{background:#fff;color:var(--blue);box-shadow:0 1px 5px #102a4312}
.content{max-width:1400px;margin:auto;padding:25px}.page{display:none}.page.active{display:block}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.heading h1{margin:5px 0 3px;color:var(--navy);font-size:26px;line-height:1.2}.heading p{margin:0;color:var(--muted)}.heading-actions,.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{padding:9px 13px;border:1px solid #d6e0e6;border-radius:8px;background:#fff;color:var(--navy);font-weight:700}.btn:hover{background:#f1f7fa}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.primary:hover{background:#076b91}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:11px}.icon-btn{padding:3px 8px;border:0;background:none;color:var(--muted);font-size:20px}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.panel,.tile,.tariff-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stat{min-height:105px;padding:14px 16px}.stat-label{color:var(--muted);font-size:11px;font-weight:700}.stat-value{margin:7px 0 3px;color:var(--navy);font-size:24px;font-weight:800;line-height:1.15}.stat-note{color:var(--muted);font-size:11px}.panel{padding:17px;margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.panel-head h2{margin:0;color:var(--navy);font-size:16px}.panel-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}
.notice{padding:11px 13px;border:1px solid #d9eaf0;border-radius:9px;background:#edf6f9;color:#486573;font-size:11px}.notice.demo{margin-bottom:16px}.muted{color:var(--muted)}.field{display:grid;gap:5px}.field label{color:#526879;font-size:11px;font-weight:750}.field input,.field select,.field textarea,.filter-input{width:100%;min-width:0;padding:9px 10px;border:1px solid #d6e0e6;border-radius:8px;background:#fff;color:var(--ink)}.field textarea{min-height:70px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter-row .search{flex:1;min-width:190px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.table{width:100%;min-width:930px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:middle}.table th{background:#f7f9fa;color:#607482;font-size:10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}.table td{font-size:11px}.table tbody tr:last-child td{border:0}.table select{max-width:160px;padding:6px;border:1px solid #d6e0e6;border-radius:7px;background:white;font-size:10px}.actions-cell{display:flex;gap:5px}.status{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf3f6;color:#536a79;font-size:10px;font-weight:750;white-space:nowrap}.status.new{background:#e7f3fa;color:#16749a}.status.done{background:var(--greenbg);color:var(--green)}.status.declined{background:var(--redbg);color:var(--red)}.empty{padding:28px 16px;color:var(--muted);text-align:center}
.quick-grid{grid-template-columns:repeat(3,1fr);margin:14px 0 18px}.quick{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left;color:var(--navy);font-weight:750}.quick:hover{border-color:#a5d4e2;background:#f9fdff}.quick-symbol{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#e9f5f8;color:var(--blue);font-size:17px}.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f2}.list-item:last-child{border-bottom:0}.client-name{color:var(--navy);font-weight:750}.item-meta{color:var(--muted);font-size:10px}
.tariffs{grid-template-columns:repeat(3,minmax(0,1fr))}.tariff-card{overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}.tariff-card:hover{transform:translateY(-2px);border-color:#abd8e4}.art{height:145px;position:relative;overflow:hidden;background:linear-gradient(135deg,#e7f6fb,#c3e8f2)}.art.purple{background:linear-gradient(135deg,#f0edff,#d6d4ff)}.art.green{background:linear-gradient(135deg,#e9f8f0,#c9eedb)}.art svg{width:100%;height:100%;display:block}.demo-tag{position:absolute;top:10px;left:10px;padding:5px 8px;border:1px solid #ffffffb0;border-radius:99px;background:#ffffffdc;color:#526778;font-size:9px;font-weight:850;letter-spacing:.05em}.tariff-body{padding:14px}.tariff-body h3{margin:0;color:var(--navy);font-size:15px}.tariff-service{margin:3px 0 9px;color:var(--blue);font-size:10px;font-weight:800;text-transform:uppercase}.tariff-price{color:var(--navy);font-size:21px;font-weight:850}.tariff-price small{color:var(--muted);font-size:10px;font-weight:500}.tariff-desc{min-height:35px;margin:7px 0 11px;color:var(--muted);font-size:11px}.tariff-card .btn{margin:0 14px 14px}
.plan-card{padding:15px;border:1px solid var(--line);border-radius:11px;background:#fff}.plan-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.plan-card h3{margin:0;color:var(--navy);font-size:17px}.badge{padding:4px 8px;border-radius:99px;background:var(--amberbg);color:var(--amber);font-size:9px;font-weight:800;white-space:nowrap}.badge.good{background:var(--greenbg);color:var(--green)}.plan-inputs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.plan-inputs input{width:100%;padding:8px;border:1px solid #d6e0e6;border-radius:7px}.mini-metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mini-metric{padding:8px;border-radius:7px;background:#f6f8fa}.mini-metric span{display:block;color:var(--muted);font-size:9px}.mini-metric strong{color:var(--navy);font-size:13px}.progress-label{display:flex;justify-content:space-between;margin-top:11px;font-size:11px;font-weight:750}.progress{height:8px;margin-top:6px;overflow:hidden;border-radius:99px;background:#e8eef1}.progress span{display:block;height:100%;border-radius:inherit;background:var(--cyan)}.progress span.good{background:var(--green)}.pace{margin-top:9px;padding:8px;border-radius:7px;background:#eff7fa;color:#456372;font-size:10px}
.chart-row{display:grid;grid-template-columns:75px 1fr 58px;align-items:center;gap:9px;margin:11px 0}.chart-label{color:#526879;font-size:10px;font-weight:750}.chart-track{height:13px;overflow:hidden;border-radius:99px;background:#edf1f3}.chart-fill{height:100%;border-radius:inherit;background:var(--cyan)}.chart-value{text-align:right;color:var(--navy);font-size:10px;font-weight:800}.priority.high{color:var(--red);font-weight:800}.priority.medium{color:var(--amber);font-weight:800}.priority.low{color:var(--muted);font-weight:800}.overdue td{background:#fff9ef}
dialog{width:min(620px,calc(100% - 24px));max-height:90vh;padding:0;border:0;border-radius:14px;box-shadow:0 25px 80px #071b2e55}dialog::backdrop{background:#091e30a6}.modal{padding:19px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modal-head h2{margin:0;color:var(--navy);font-size:18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;right:18px;bottom:18px;z-index:10;padding:11px 15px;border-radius:9px;background:var(--navy);color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.menu-toggle{display:none}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.three-col,.tariffs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.sidebar{width:215px}.main{margin-left:215px}.content{padding:19px}.topbar{padding:10px 17px}.employee-input{width:145px}.top-right .field{min-width:110px}}
@media(max-width:620px){.sidebar{width:250px;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu-toggle{display:inline-block}.topbar{padding:9px 12px;gap:8px}.top-left,.top-right{gap:7px}.employee-input{width:106px!important}.top-right input[type=month]{width:120px}.language{gap:0}.language button{padding:6px}.top-title{font-size:13px}.content{padding:16px 12px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:23px}.heading-actions{width:100%}.heading-actions .btn{flex:1}.stats{gap:8px}.stat{padding:11px;min-height:93px}.stat-value{font-size:20px}.two-col,.three-col,.tariffs,.quick-grid,.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.filter-row .search{min-width:100%;order:-1}.table{min-width:900px}.panel{padding:13px}.art{height:155px}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="brand-mark">TF</span><span>Telecom Flow</span></div>
  <div class="nav-caption" data-i18n="workspace"></div>
  <nav class="nav" aria-label="Main navigation">
    <button class="active" data-page="dashboard"><span class="nav-icon">⌂</span><span data-i18n="navDash"></span></button>
    <button data-page="clients"><span class="nav-icon">▤</span><span data-i18n="navClients"></span></button>
    <button data-page="tariffs"><span class="nav-icon">▦</span><span data-i18n="navTariffs"></span></button>
    <button data-page="plan"><span class="nav-icon">▥</span><span data-i18n="navPlan"></span></button>
    <button data-page="tasks"><span class="nav-icon">☷</span><span data-i18n="navTasks"></span></button>
  </nav>
  <div class="sidebar-foot" data-i18n="sidebarFoot"></div>
</aside>

<div class="main">
<header class="topbar">
  <div class="top-left"><button class="btn small menu-toggle" id="menuToggle" aria-label="Menu">☰</button><div class="top-title">Telecom Flow</div></div>
  <div class="top-right">
    <div class="field"><label data-i18n="employeeLabel" for="employeeInput"></label><input class="employee-input" id="employeeInput"></div>
    <div class="field"><label data-i18n="monthLabel" for="monthInput"></label><input id="monthInput" type="month"></div>
    <div class="language" aria-label="Language">
      <button data-lang="kk">KZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main class="content">
  <section class="page active" id="page-dashboard">
    <div class="heading">
      <div><div class="eyebrow" data-i18n="dashEyebrow"></div><h1 data-i18n="navDash"></h1><p id="todayLine"></p></div>
      <div class="heading-actions">
        <button class="btn" id="saveBtn" data-i18n="save"></button>
        <button class="btn" id="restoreBtn" data-i18n="restore"></button>
        <button class="btn danger" id="resetBtn" data-i18n="reset"></button>
      </div>
    </div>
    <div class="notice demo" id="demoNotice" data-i18n="demoNotice"></div>
    <div class="grid stats" id="dashboardStats"></div>
    <div class="panel">
      <div class="panel-head"><div><h2 data-i18n="quickActions"></h2><p data-i18n="quickDescription"></p></div></div>
      <div class="grid quick-grid">
        <button class="quick" id="quickClient"><span class="quick-symbol">＋</span><span data-i18n="addClient"></span></button>
        <button class="quick" data-go="tariffs"><span class="quick-symbol">⌕</span><span data-i18n="seeTariffs"></span></button>
        <button class="quick" id="quickTask"><span class="quick-symbol">＋</span><span data-i18n="addTask"></span></button>
      </div>
    </div>
    <div class="grid two-col">
      <div class="panel"><div class="panel-head"><div><h2 data-i18n="callsToday"></h2><p data-i18n="callsCaption"></p></div><button class="btn small" data-go="clients" data-i18n="viewAll"></button></div><div id="callsList"></div></div>
      <div class="panel"><div class="panel-head"><div><h2 data-i18n="upcomingTasks"></h2><p data-i18n="upcomingCaption"></p></div><button class="btn small" data-go="tasks" data-i18n="viewAll"></button></div><div id="upcomingTasks"></div></div>
      <div class="panel"><div class="panel-head"><div><h2 data-i18n="recentClients"></h2><p data-i18n="recentCaption"></p></div><button class="btn small" data-go="clients" data-i18n="viewAll"></button></div><div id="recentClients"></div></div>
      <div class="panel"><div class="panel-head"><div><h2 data-i18n="popularTariffs"></h2><p data-i18n="popularCaption"></p></div><button class="btn small" data-go="tariffs" data-i18n="viewAll"></button></div><div id="popularTariffs"></div></div>
    </div>
  </section>

  <section class="page" id="page-clients">
    <div class="heading"><div><div class="eyebrow" data-i18n="clientEyebrow"></div><h1 data-i18n="navClients"></h1><p data-i18n="clientIntro"></p></div><div class="heading-actions"><button class="btn primary" id="newClientBtn">+ <span data-i18n="addClient"></span></button></div></div>
    <div class="panel">
      <div class="filter-row"><input class="filter-input search" id="clientSearch" type="search" data-i18n-placeholder="searchClients"><select class="filter-input" id="clientStatusFilter"></select></div>
      <div class="table-wrap"><table class="table"><thead><tr>
        <th data-i18n="colNumber"></th><th data-i18n="colClient"></th><th data-i18n="colPhone"></th><th data-i18n="colSource"></th><th data-i18n="colInterest"></th><th data-i18n="colTariff"></th><th data-i18n="colStatus"></th><th data-i18n="colNext"></th><th data-i18n="colActions"></th>
      </tr></thead><tbody id="clientsBody"></tbody></table></div>
      <div class="item-meta" id="clientCount"></div>
    </div>
  </section>

  <section class="page" id="page-tariffs">
    <div class="heading"><div><div class="eyebrow" data-i18n="tariffEyebrow"></div><h1 data-i18n="navTariffs"></h1><p data-i18n="tariffIntro"></p></div></div>
    <div class="notice demo" data-i18n="tariffDemoNotice"></div>
    <div class="panel">
      <div class="filter-row"><input class="filter-input search" id="tariffSearch" type="search" data-i18n-placeholder="searchTariffs"><select class="filter-input" id="tariffCategory"></select></div>
      <div class="grid tariffs" id="tariffGrid"></div>
    </div>
  </section>

  <section class="page" id="page-plan">
    <div class="heading"><div><div class="eyebrow" data-i18n="planEyebrow"></div><h1 data-i18n="navPlan"></h1><p id="planPeriod"></p></div></div>
    <div class="grid stats" id="planStats"></div>
    <div class="panel"><div class="panel-head"><div><h2 data-i18n="planDirections"></h2><p data-i18n="planHelp"></p></div><div class="field" style="min-width:150px"><label for="workdays" data-i18n="workdays"></label><input id="workdays" type="number" min="0" step="1"></div></div><div class="grid three-col" id="planCards"></div></div>
    <div class="notice" data-i18n="localNote"></div>
  </section>

  <section class="page" id="page-tasks">
    <div class="heading"><div><div class="eyebrow" data-i18n="tasksEyebrow"></div><h1 data-i18n="navTasks"></h1><p data-i18n="tasksIntro"></p></div><div class="heading-actions"><button class="btn primary" id="newTaskBtn">+ <span data-i18n="addTask"></span></button><button class="btn" id="csvBtn" data-i18n="exportCsv"></button></div></div>
    <div class="panel"><div class="panel-head"><div><h2 data-i18n="taskList"></h2><p data-i18n="taskCaption"></p></div></div>
      <div class="filter-row"><input class="filter-input search" id="taskSearch" type="search" data-i18n-placeholder="searchTasks"><select class="filter-input" id="taskFilter"></select></div>
      <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="taskTitle"></th><th data-i18n="taskClient"></th><th data-i18n="taskDue"></th><th data-i18n="priority"></th><th data-i18n="taskStatus"></th><th data-i18n="colActions"></th></tr></thead><tbody id="tasksBody"></tbody></table></div>
      <div class="item-meta" id="taskCount"></div>
    </div>
    <div class="grid two-col">
      <div class="panel"><div class="panel-head"><div><h2 data-i18n="salesSummary"></h2><p id="reportMonth"></p></div></div><div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0" id="reportStats"></div></div>
      <div class="panel"><div class="panel-head"><div><h2 data-i18n="channelsReport"></h2><p data-i18n="channelsCaption"></p></div></div><div id="channelChart"></div></div>
    </div>
  </section>
</main>
</div>

<dialog id="clientDialog"><form class="modal" id="clientForm">
  <div class="modal-head"><h2 id="clientDialogTitle"></h2><button class="icon-btn" type="button" data-close="clientDialog">×</button></div>
  <input id="clientId" type="hidden">
  <div class="form-grid">
    <div class="field"><label data-i18n="labelName" for="clientName"></label><input id="clientName" required maxlength="100"></div>
    <div class="field"><label data-i18n="labelPhone" for="clientPhone"></label><input id="clientPhone" required maxlength="32" placeholder="+7 700 000 00 01"></div>
    <div class="field"><label data-i18n="labelSource" for="clientSource"></label><select id="clientSource"></select></div>
    <div class="field"><label data-i18n="labelInterest" for="clientInterest"></label><select id="clientInterest"></select></div>
    <div class="field"><label data-i18n="labelTariff" for="clientTariff"></label><select id="clientTariff"></select></div>
    <div class="field"><label data-i18n="labelStatus" for="clientStatus"></label><select id="clientStatus"></select></div>
    <div class="field wide"><label data-i18n="labelNextContact" for="clientNext"></label><input id="clientNext" type="datetime-local"></div>
  </div>
  <div class="modal-actions"><button class="btn" type="button" data-close="clientDialog" data-i18n="cancel"></button><button class="btn primary" type="submit" data-i18n="save"></button></div>
</form></dialog>

<dialog id="tariffDialog"><div class="modal"><div class="modal-head"><h2 id="tariffDetailTitle"></h2><button class="icon-btn" type="button" data-close="tariffDialog">×</button></div><div id="tariffDetail"></div><div class="modal-actions"><button class="btn" type="button" data-close="tariffDialog" data-i18n="close"></button><button class="btn primary" type="button" id="proposeTariff" data-i18n="propose"></button></div></div></dialog>

<dialog id="taskDialog"><form class="modal" id="taskForm">
  <div class="modal-head"><h2 id="taskDialogTitle"></h2><button class="icon-btn" type="button" data-close="taskDialog">×</button></div>
  <input id="taskId" type="hidden">
  <div class="form-grid">
    <div class="field wide"><label data-i18n="taskTitle" for="taskName"></label><input id="taskName" required maxlength="140"></div>
    <div class="field wide"><label data-i18n="taskClient" for="taskClient"></label><select id="taskClient"></select></div>
    <div class="field"><label data-i18n="taskDue" for="taskDue"></label><input id="taskDue" type="datetime-local" required></div>
    <div class="field"><label data-i18n="priority" for="taskPriority"></label><select id="taskPriority"></select></div>
    <div class="field wide"><label data-i18n="taskStatus" for="taskStatus"></label><select id="taskStatus"></select></div>
  </div>
  <div class="modal-actions"><button class="btn" type="button" data-close="taskDialog" data-i18n="cancel"></button><button class="btn primary" type="submit" data-i18n="save"></button></div>
</form></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

function tr(key,params={}) {

  for(const [name,replacement] of Object.entries(params)) value=value.replaceAll(`{${name}}`,String(replacement));
  return value;
}

function loadState(){
 try{const raw=localStorage.getItem("telecomFlow:v2");if(!raw)return null;
  const s=JSON.parse(raw);if(!s||typeof s!=="object")return null;
  s.lang=["kk","ru","en"].includes(s.lang)?s.lang:"kk";
  s.employee=String(s.employee||"");s.month=/^\d{4}-\d{2}$/.test(s.month||"")?s.month:todayDate().slice(0,7);
  s.plans=s.plans&&typeof s.plans==="object"?s.plans:{};
  s.clients=Array.isArray(s.clients)?s.clients:[];s.tasks=Array.isArray(s.tasks)?s.tasks:[];
  return s;
 }catch{return null}
}
function saveState(notify=false){
 try{localStorage.setItem("telecomFlow:v2",JSON.stringify(state));if(notify)toast(tr("saved"));return true}
 catch{if(notify)toast(tr("saveError"));return false}
}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveState(false),250)}
function markChanged(){state.demo=false;$("demoNotice").hidden=true;queueSave()}
function toast(message){const el=$("toast");el.textContent=message;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2200)}
function count(n){const v=Number(n);return Number.isFinite(v)?Math.max(0,Math.floor(v)):0}
function planRecord(){const k=pKey(state.employee,state.month);if(!state.plans[k])state.plans[k]=emptyPlan();const r=state.plans[k];r.plan=r.plan||{};r.done=r.done||{};for(const d of ["shpd","tv","fms"]){r.plan[d]=count(r.plan[d]);r.done[d]=count(r.done[d])}r.workdays=count(r.workdays);return r}
function serviceName(key){return tr("svc_"+key)}
function sourceName(key){return tr("src_"+key)}
function statusName(key){return tr("st_"+key)}
function tariff(id){return TARIFFS.find(x=>x.id===id)}
function tariffName(item){return item?.name?.[state.lang]||item?.name?.kk||tr("notSet")}
function dateText(value,includeTime=true){
 if(!value)return "—";
 const d=new Date(value);
 if(Number.isNaN(d.getTime()))return value;
 return new Intl.DateTimeFormat(state.lang==="kk"?"kk-KZ":state.lang==="ru"?"ru-RU":"en-US",includeTime?{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}:{month:"short",day:"numeric"}).format(d);
}
function pct(value){return `${Number(value.toFixed(1))}%`}
function metric(d,r=planRecord()){
 const plan=count(r.plan[d]),done=count(r.done[d]),goal=Math.ceil(plan*1.05);
 return {plan,done,goal,p:plan?done/plan*100:0,left:Math.max(0,plan-done),left105:Math.max(0,goal-done),met:plan>0&&done>=plan,met105:plan>0&&done>=goal};
}
function totals(){
 const m=["shpd","tv","fms"].map(id=>metric(id));
 const plan=m.reduce((a,x)=>a+x.plan,0),done=m.reduce((a,x)=>a+x.done,0),goal=Math.ceil(plan*1.05);
 return {plan,done,p:plan?done/plan*100:0,left:Math.max(0,plan-done),goal,left105:Math.max(0,goal-done)};
}
function appNumber(){
